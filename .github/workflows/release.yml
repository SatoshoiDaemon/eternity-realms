name: Build and publish Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, build APK, and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run coverage
      - run: npm run validate:content
      - run: npm run validate:changelog
      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: node scripts/generate-release-notes.mjs "$RELEASE_TAG" "$NOTES_FILE"
      - run: npm run android:apk
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Eternity Realms ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, 'preview') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
